<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="chargeback-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1b18"/>
      <stop offset="1" stop-color="#12110f"/>
    </linearGradient>
    <filter id="chargeback-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#12110f"/>
  <rect width="12" height="630" fill="#d7b680"/>
  <circle cx="1070" cy="82" r="280" fill="#d7b680" opacity=".035"/>
  <circle cx="1100" cy="590" r="330" fill="#d7b680" opacity=".025"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="100" fill="#d7b680" font-family="JetBrains Mono, Menlo, monospace" font-size="20" font-weight="600" letter-spacing="4">FLAGSHIP AI AGENT</text>
    <rect x="76" y="128" width="90" height="4" rx="2" fill="#d7b680"/>

    <text x="70" y="260" fill="#f4efe7" font-size="82" font-weight="700" letter-spacing="-3">ChargeBack</text>
    <text x="76" y="321" fill="#c6b9a5" font-size="27">Card-fraud disputes with controlled actions</text>
    <text x="76" y="370" fill="#d7b680" font-family="JetBrains Mono, Menlo, monospace" font-size="21">Evaluate · Observe · Guard</text>

    <g transform="translate(690 108)" filter="url(#chargeback-shadow)">
      <rect width="430" height="390" rx="22" fill="url(#chargeback-panel)" stroke="#5d503e" stroke-width="2"/>
      <text x="30" y="47" fill="#8e806c" font-family="JetBrains Mono, Menlo, monospace" font-size="15" letter-spacing="2">TRACEABLE WORKFLOW</text>

      <g transform="translate(30 78)">
        <rect width="370" height="65" rx="11" fill="#24211c" stroke="#6f5f48"/>
        <circle cx="31" cy="32" r="13" fill="#332b21"/>
        <text x="31" y="38" text-anchor="middle" fill="#d7b680" font-family="JetBrains Mono, Menlo, monospace" font-size="14">1</text>
        <text x="57" y="28" fill="#f4efe7" font-size="17" font-weight="600">Look up transaction</text>
        <text x="57" y="49" fill="#8e806c" font-size="14">Match the signed-in cardholder</text>
      </g>
      <g transform="translate(30 158)">
        <rect width="370" height="65" rx="11" fill="#24211c" stroke="#6f5f48"/>
        <circle cx="31" cy="32" r="13" fill="#332b21"/>
        <text x="31" y="38" text-anchor="middle" fill="#d7b680" font-family="JetBrains Mono, Menlo, monospace" font-size="14">2</text>
        <text x="57" y="28" fill="#f4efe7" font-size="17" font-weight="600">Score fraud</text>
        <text x="57" y="49" fill="#8e806c" font-size="14">Send the score to policy</text>
      </g>
      <g transform="translate(30 238)">
        <rect width="370" height="65" rx="11" fill="#24211c" stroke="#d7b680"/>
        <circle cx="31" cy="32" r="13" fill="#3b3022"/>
        <text x="31" y="38" text-anchor="middle" fill="#d7b680" font-family="JetBrains Mono, Menlo, monospace" font-size="14">3</text>
        <text x="57" y="28" fill="#f4efe7" font-size="17" font-weight="600">Apply policy gate</text>
        <text x="57" y="49" fill="#d7b680" font-size="14">Refuse · Review · File</text>
      </g>

      <g transform="translate(30 330)">
        <rect width="119" height="8" rx="4" fill="#d77b70"/>
        <rect x="125" width="119" height="8" rx="4" fill="#d7b680"/>
        <rect x="250" width="120" height="8" rx="4" fill="#7fbc91"/>
        <text y="31" fill="#8e806c" font-family="JetBrains Mono, Menlo, monospace" font-size="13">POLICY BEFORE ACTION</text>
      </g>
    </g>

    <g transform="translate(76 442)">
      <rect width="460" height="50" rx="25" fill="#27231d" stroke="#6f5f48"/>
      <circle cx="25" cy="25" r="5" fill="#d7b680"/>
      <text x="45" y="32" fill="#d7b680" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="1">EVALUATION · GUARDRAILS · TOOL TRACES</text>
    </g>

    <circle cx="78" cy="546" r="5" fill="#d7b680"/>
    <text x="100" y="555" fill="#8e806c" font-family="JetBrains Mono, Menlo, monospace" font-size="21">kalyanvenk.com/chargeback</text>
  </g>
</svg>
