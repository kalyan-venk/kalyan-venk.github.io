<svg xmlns="http://www.w3.org/2000/svg" width="112" height="48" viewBox="0 0 112 48">
  <style>
    .exhaust { transform-origin: 36px 24px; animation: ignite 2s ease-out both; }
    @keyframes ignite {
      0% { transform: scale(.08,.25); }
      32% { transform: scale(.7,.8); }
      60% { transform: scale(.55,.7); }
      100% { transform: scale(1,1); }
    }
    @media (prefers-reduced-motion: reduce) { .exhaust { animation: none; } }
  </style>
